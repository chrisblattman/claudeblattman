# Staging build — Cloudflare Pages preview of the redesign.
#
# Inherits everything from mkdocs.yml and changes only what must not leak
# production identity onto a preview host. Run it with scripts/build-staging.sh,
# which also handles the two things config alone cannot fix (CNAME, robots.txt).
INHERIT: mkdocs.yml

# Canonical tags, sitemap and og: URLs otherwise all claim claudeblattman.com,
# so a preview page would advertise the production URL of a page that may not
# exist there yet. Cloudflare sets CF_PAGES_URL on every build; the fallback is
# only for running this locally.
site_url: !ENV [CF_PAGES_URL, 'http://127.0.0.1:8000']

# Inherit the real wordmark/tagline; Oct 21 feedback removes the visible
# PREVIEW label. Preview hosting/indexing safeguards remain below and in the build script.

# Same list as mkdocs.yml MINUS `social`. Two reasons: the Cloudflare build
# image has no libcairo, so card generation fails there; and the cards it does
# make embed absolute production URLs. A child `plugins:` list REPLACES the
# parent's rather than merging, so this has to be spelled out in full — if you
# add a plugin to mkdocs.yml, add it here too.
plugins:
  - search
  - meta
  - redirects:
      redirect_maps:
        workflows/recursive-review.md: starter-kit/occasional.md
        workflows/adversarial-review.md: starter-kit/occasional.md
        build-your-own/chatgpt-vs-claude.md: build-your-own/picking-your-agent.md
        build-your-own/dial-back-discipline.md: hyperlinks/dial-back-discipline.md
        downloads/agents-vs-skills-guide.md: hyperlinks/downloads/agents-vs-skills-guide.md
