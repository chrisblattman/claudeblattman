<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc"><title id="title">From your request to your next session</title><desc id="desc">Saved skill instructions feed /council. Three independent members produce separate reports for synthesis. Your judgment leads to revised work and /done, which saves a handoff for the next session. File names describe Chris’s inspected setup.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#00695f"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#173b36;font-size:19px}.title{font-weight:700;font-size:23px}.small{font-size:20px}.file{font-family:monospace;font-size:18px;fill:#00695f}.line{fill:none;stroke:#00695f;stroke-width:2;marker-end:url(#arrow)}.return{stroke-dasharray:7 6}.node{fill:#fff;stroke:#00695f;stroke-width:1.6}.support{fill:#f0f7f5;stroke:#b2cec7;stroke-width:1.3}</style>
