<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">The council loop and the files it saves</title><desc id="desc">Your request goes to the council skill, which structures the brief, dispatches independent agents, optionally challenges their reports, and synthesizes the findings. You clarify and decide, revise the work, and save a handoff. A return arrow shows a new council on revised work. File labels reflect Chris’s inspected archive, not numbered round folders.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#00695f"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#132e2b;font-size:18px}.title{font-weight:700;font-size:21px}.file{font-family:monospace;font-size:15px;fill:#00695f}.small{font-size:16px}.line{fill:none;stroke:#00695f;stroke-width:2;marker-end:url(#arrow)}.node{fill:#fff;stroke:#00695f;stroke-width:1.8;rx:8}</style><rect x="205" y="22" width="680" height="335" rx="12" fill="#f2f8f6" stroke="#00695f" stroke-dasharray="5 5"/><text x="225" y="46" text-anchor="start" class="small">Inside the /council skill</text><rect class="node" x="20" y="80" width="160" height="90"/><text x="100.0" y="109" text-anchor="middle" class="title">Your request</text><text x="100.0" y="134" text-anchor="middle" class="small">Type or dictate</text><rect class="node" x="225" y="80" width="170" height="110"/><text x="310.0" y="109" text-anchor="middle" class="title">Shared brief</text><text x="310.0" y="134" text-anchor="middle" class="small">Your words + context</text><text x="310.0" y="175" text-anchor="middle" class="file">PROMPT.md</text><rect class="node" x="440" y="62" width="135" height="43"/><text x="507.5" y="91" text-anchor="middle" class="title">Agent 1</text><rect class="node" x="440" y="116" width="135" height="43"/><text x="507.5" y="145" text-anchor="middle" class="title">Agent 2</text><rect class="node" x="440" y="170" width="135" height="43"/><text x="507.5" y="199" text-anchor="middle" class="title">Agent 3</text><text x="508" y="235" text-anchor="middle" class="small">Independent reports</text><text x="508" y="258" text-anchor="middle" class="file">seat-prompts/ · reports¹</text><rect class="node" x="685" y="80" width="180" height="110"/><text x="775.0" y="109" text-anchor="middle" class="title">Synthesis</text><text x="775.0" y="134" text-anchor="middle" class="small">Compare the evidence</text><text x="775.0" y="175" text-anchor="middle" class="file">SYNTHESIS.md</text><rect class="node" x="410" y="278" width="220" height="62"/><text x="520.0" y="307" text-anchor="middle" class="title">Adversarial check</text><text x="520.0" y="332" text-anchor="middle" class="small">Full council only</text><path class="line" d="M180 125 H225"/><path class="line" d="M395 125 H420 V84 H440"/><path class="line" d="M420 125 H440"/><path class="line" d="M420 125 V191 H440"/><path class="line" d="M575 84 H610 V125 H685"/><path class="line" d="M575 137 H610"/><path class="line" d="M575 191 H610 V137"/><path class="line" d="M610 137 V245 H630 V278" stroke-dasharray="6 5"/><path class="line" d="M630 309 H650 V165 H685" stroke-dasharray="6 5"/><text x="641" y="109" text-anchor="middle" class="small">Light</text><rect class="node" x="665" y="380" width="200" height="100"/><text x="765.0" y="409" text-anchor="middle" class="title">Your judgment</text><text x="765.0" y="434" text-anchor="middle" class="small">Ask, clarify, decide</text><rect class="node" x="340" y="380" width="230" height="100"/><text x="455.0" y="409" text-anchor="middle" class="title">Revise the work</text><text x="455.0" y="434" text-anchor="middle" class="small">Update the actual artifact</text><rect class="node" x="25" y="380" width="215" height="100"/><text x="132.5" y="409" text-anchor="middle" class="title">Save a handoff</text><text x="132.5" y="434" text-anchor="middle" class="small">/done</text><text x="132.5" y="465" text-anchor="middle" class="file">HANDOFF.md</text><path class="line" d="M775 190 V380"/><path class="line" d="M665 430 H570"/><path class="line" d="M340 430 H240"/><path class="line" d="M455 480 V535 H8 V125 H20"/><text x="450" y="526" text-anchor="middle" class="small">New council on revised work, when another review has a job</text><text x="450" y="594" text-anchor="middle" class="small">¹ Original reports: external-arms/ or native-attempts/; MANIFEST.md points to them.</text></svg>