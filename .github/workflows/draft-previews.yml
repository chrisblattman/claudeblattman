name: Draft Preview

on:
  push:
    branches:
      - drafts
      - 'draft/**'
      - codex/shared-draft-previews
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: draft-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DRAFT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public release boundaries
        run: bash scripts/emit-public.sh --check
      - name: Install preview build tools
        run: python -m pip install -r requirements-staging.txt
      - name: Build the draft
        run: python scripts/build-draft-preview.py
      - name: Publish a preview without deploying production
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
        run: node scripts/publish-draft-preview.mjs
      - name: Link the preview from the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
          PREVIEW_COMMIT: ${{ steps.publish.outputs.commit }}
        with:
          script: |
            const marker = '<!-- claudeblattman-draft-preview -->';
            const body = `${marker}\n[Open the draft preview](${process.env.PREVIEW_URL})\n\nSource commit: ${process.env.PREVIEW_COMMIT}\n\nThis preview does not publish the live site.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body
            });
            else await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
