<rect class="support" x="225" y="535" width="105" height="48" rx="10"/>
<text x="277.5" y="566.0" class="small" text-anchor="middle">Report 2</text>
<path class="line" d="M85 389 H43 V559 H65"/>
<path class="line" d="M195 559 H225"/>
<path class="line" d="M330 559 H345 V695 H207 V725"/>
