<text x="207.5" y="169.5" class="small" text-anchor="middle">Templates, rules</text>
<text x="207.5" y="195.5" class="small" text-anchor="middle">and guidelines</text>
<rect class="node" x="85" y="245" width="245" height="75" rx="10"/>
<text x="207.5" y="276.5" class="title" text-anchor="middle">/council</text>
<text x="207.5" y="302.5" class="small" text-anchor="middle">Prepare and send</text>
