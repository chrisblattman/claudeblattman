<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" role="img" aria-labelledby="t d"><title id="t">The council loop</title><desc id="d">Request, shared brief, three independent agents, optional adversary, synthesis, your judgment, revision, and handoff. A return arrow from revision starts a fresh council. File labels use Chris’s inspected archive names.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00695f"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#132e2b;font-size:20px}.title{font-size:23px;font-weight:700}.file{font-family:monospace;font-size:17px;fill:#00695f}.small{font-size:18px}.node{fill:#fff;stroke:#00695f;stroke-width:2;rx:8}.line{fill:none;stroke:#00695f;stroke-width:2;marker-end:url(#a)}</style><rect class="node" x="30" y="45" width="210" height="95"/><text x="135.0" y="77" text-anchor="middle" class="title">Your request</text><text x="135.0" y="105" text-anchor="middle" class="small">Type or dictate</text><rect class="node" x="350" y="45" width="240" height="110"/><text x="470.0" y="77" text-anchor="middle" class="title">Council prepares</text><text x="470.0" y="105" text-anchor="middle" class="small">Your words + context</text><text x="470.0" y="140" text-anchor="middle" class="file">PROMPT.md</text><path class="line" d="M240 92H350"/><path class="line" d="M470 155V185H320V225"/><path class="line" d="M320 185H110V225"/><path class="line" d="M320 185H530V225"/><rect class="node" x="35" y="225" width="150" height="60"/><text x="110.0" y="257" text-anchor="middle" class="title">Agent 1</text><rect class="node" x="245" y="225" width="150" height="60"/><text x="320.0" y="257" text-anchor="middle" class="title">Agent 2</text><rect class="node" x="455" y="225" width="150" height="60"/><text x="530.0" y="257" text-anchor="middle" class="title">Agent 3</text><path class="line" d="M110 285V340H320"/><path class="line" d="M320 285V340H530"/><path class="line" d="M530 285V340H480V385"/><text x="110" y="278" text-anchor="middle" class="small">report</text><text x="320" y="278" text-anchor="middle" class="small">report</text><text x="530" y="278" text-anchor="middle" class="small">report</text><path class="line" d="M320 340H160V410"/><text x="210" y="376" text-anchor="middle" class="small">Light</text><rect class="node" x="365" y="385" width="235" height="75"/><text x="482.5" y="417" text-anchor="middle" class="title">Adversarial check</text><text x="482.5" y="445" text-anchor="middle" class="small">Full council only</text><path class="line" d="M365 425H280" stroke-dasharray="6 5"/><rect class="node" x="40" y="410" width="240" height="110"/><text x="160.0" y="442" text-anchor="middle" class="title">Synthesis</text><text x="160.0" y="470" text-anchor="middle" class="small">Compare the evidence</text><text x="160.0" y="505" text-anchor="middle" class="file">SYNTHESIS.md</text><path class="line" d="M160 520V575"/><rect class="node" x="40" y="575" width="240" height="90"/><text x="160.0" y="607" text-anchor="middle" class="title">Your judgment</text><text x="160.0" y="635" text-anchor="middle" class="small">Ask, clarify, decide</text><path class="line" d="M280 620H350"/><rect class="node" x="350" y="575" width="240" height="90"/><text x="470.0" y="607" text-anchor="middle" class="title">Revise the work</text><text x="470.0" y="635" text-anchor="middle" class="small">Update the actual artifact</text><path class="line" d="M590 620H625V12H135V45"/><text x="457" y="552" text-anchor="middle" class="small">↶ New council if needed</text><rect class="node" x="200" y="710" width="240" height="100"/><text x="320.0" y="742" text-anchor="middle" class="title">Save a handoff</text><text x="320.0" y="770" text-anchor="middle" class="small">/done</text><text x="320.0" y="795" text-anchor="middle" class="file">HANDOFF.md</text><path class="line" d="M470 665V760H440"/></svg>