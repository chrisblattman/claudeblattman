<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1130" role="img" aria-labelledby="title desc"><title id="title">The council loop and the files it saves</title><desc id="desc">Your request goes to the council skill, which structures the brief, dispatches independent agents, optionally challenges their reports, and synthesizes the findings. You clarify and decide, revise the work, and save a handoff. A return arrow shows a new council on revised work. File labels reflect Chris’s inspected archive, not numbered round folders.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#00695f"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#132e2b;font-size:18px}.title{font-weight:700;font-size:21px}.file{font-family:monospace;font-size:15px;fill:#00695f}.small{font-size:16px}.line{fill:none;stroke:#00695f;stroke-width:2;marker-end:url(#arrow)}.node{fill:#fff;stroke:#00695f;stroke-width:1.8;rx:8}</style><rect class="node" x="85" y="15" width="220" height="85"/><text x="195.0" y="44" text-anchor="middle" class="title">Your request</text><text x="195.0" y="69" text-anchor="middle" class="small">Type or dictate</text><path class="line" d="M195 100 V140"/><rect x="10" y="125" width="370" height="555" rx="12" fill="#f2f8f6" stroke="#00695f" stroke-dasharray="5 5"/><text x="25" y="150" text-anchor="start" class="small">Inside the /council skill</text><rect class="node" x="85" y="170" width="220" height="100"/><text x="195.0" y="199" text-anchor="middle" class="title">Shared brief</text><text x="195.0" y="224" text-anchor="middle" class="small">Your words + context</text><text x="195.0" y="255" text-anchor="middle" class="file">PROMPT.md</text><path class="line" d="M195 270 V290 H70 V315"/><path class="line" d="M195 290 V315"/><path class="line" d="M195 290 H320 V315"/><rect class="node" x="20" y="315" width="100" height="48"/><text x="70.0" y="344" text-anchor="middle" class="title">Agent 1</text><rect class="node" x="145" y="315" width="100" height="48"/><text x="195.0" y="344" text-anchor="middle" class="title">Agent 2</text><rect class="node" x="270" y="315" width="100" height="48"/><text x="320.0" y="344" text-anchor="middle" class="title">Agent 3</text><text x="195" y="391" text-anchor="middle" class="small">Independent reports · exact prompts</text><text x="195" y="416" text-anchor="middle" class="file">seat-prompts/ + original reports¹</text><path class="line" d="M70 363 V375 H365 V500 H320"/><path class="line" d="M195 363 V375 H320"/><path class="line" d="M320 363 V375 H365"/><rect class="node" x="70" y="465" width="250" height="65"/><text x="195.0" y="494" text-anchor="middle" class="title">Adversarial check</text><text x="195.0" y="519" text-anchor="middle" class="small">Full council only</text><path class="line" d="M195 530 V565"/><path class="line" d="M365 435 V615 H315" stroke-dasharray="6 5"/><text x="344" y="555" text-anchor="middle" class="small">Light</text><rect class="node" x="75" y="565" width="240" height="95"/><text x="195.0" y="594" text-anchor="middle" class="title">Synthesis</text><text x="195.0" y="619" text-anchor="middle" class="small">Compare the evidence</text><text x="195.0" y="645" text-anchor="middle" class="file">SYNTHESIS.md</text><path class="line" d="M195 660 V710"/><rect class="node" x="75" y="710" width="240" height="80"/><text x="195.0" y="739" text-anchor="middle" class="title">Your judgment</text><text x="195.0" y="764" text-anchor="middle" class="small">Ask, clarify, decide</text><path class="line" d="M195 790 V835"/><rect class="node" x="75" y="835" width="240" height="80"/><text x="195.0" y="864" text-anchor="middle" class="title">Revise the work</text><text x="195.0" y="889" text-anchor="middle" class="small">Update the actual artifact</text><path class="line" d="M195 915 V965"/><rect class="node" x="75" y="965" width="240" height="100"/><text x="195.0" y="994" text-anchor="middle" class="title">Save a handoff</text><text x="195.0" y="1019" text-anchor="middle" class="small">/done</text><text x="195.0" y="1050" text-anchor="middle" class="file">HANDOFF.md</text><path class="line" d="M75 875 H2 V58 H85"/><text x="195" y="940" text-anchor="middle" class="small">↶ A new council reviews revised work</text><text x="195" y="1094" text-anchor="middle" class="file">¹ external-arms/ or native-attempts/</text><text x="195" y="1117" text-anchor="middle" class="small">MANIFEST.md points to the reports.</text></svg>