const paper=(docs=false)=>`<h2><span class="yellow">Annotation workflows: notes and next steps</span></h2><p style="font-size:.8em;color:#888">Follow-up from the annotation discussion</p><h3>1. Why this matters</h3><p>Most of our project work is back-and-forth with AI: reacting to draft replies, files it writes, and the edits it makes. Point at the passage instead of describing it from memory.</p><h3>2. What already works</h3><ul><li>Highlight part of a message and add a reply.</li><li>Comment on a Markdown file in source view.</li><li>Read a Google Doc’s comments beside the chat.</li></ul><h3><span class="yellow">3. Open questions</span></h3><ul><li>Can the agent read the saved PDF comments?</li><li>Which connector does this account have?</li><li>How do we save the revised document?</li></ul><h3>4. Proposed site changes</h3><p>Add a short page with one example for each route. Show the controls and explain where to leave a comment.</p><h3>${docs?'<span class="yellow">5. Next steps</span>':'5. Next steps'}</h3><p>Try each workflow with a short document and check the resulting revision.</p>`;

ate users</h3><table><tr><th>Are you already doing this?</th><th>Start here</th></tr><tr class="group"><td>1. Use an AI app on your computer</td><td></td></tr><tr><td>□ Have you tried agentic AI?</td><td><a>Start from scratch</a></td></tr><tr><td>□ Are you annotating?</td><td><a>Point and comment</a></td></tr></table></div></div><div class="floating-comment"><span>Add a comment…</span>${I('mic')}<span class="send">${I('arrow')}</span></div><div class="annotationbar">${I('grip')}<span>Annotating · 1</span>${I('annotate')}${I('hide')}${I('panel')}${I('trash')}<button>Send</button>${I('close')}</div></div></div>`});
figures.push({id:'claude-reply',cls:'claude',html:`<div class="body">${side()}<div class="chat full">${head('Review the project draft')}<div class="replycenter"><div class="user">Can you summarize the changes we should make to our project overview?</div><div class="loaded">Read project notes, reviewed draft &nbsp; ›</div><p>The draft explains what we want to study. It still needs to say what we expect to learn and which decisions the pilot will help us make.</p><p>I would focus on two things:</p><ul><li><b>Make the research question more specific.</b> Name the barriers firms face, rather than describing them as a general problem.</li><li><b>Explain what the pilot will test.</b> Distinguish what we already know from what the interviews still need to establish.</li></ul><p>The next version can be shorter. Most of the background belongs in the literature review, with a link from the overview.</p><p class="replytext">Start with <span class="bluehl">the main research question</span>, then explain how the pilot will help answer it.<span class="replypopup"><span class="quoted" style="display:block">the main research question</span><span class="replyinput"><span>Reply to Claude</span>${I('mic')}${I('comment')}</span></span></p><div class="questionbox"><p class="small">I can revise the overview using the project notes, leaving the design decisions for you to review.</p><p>Should I start with a shorter introduction?</p><span class="small">Yes, start there</span></div></div><div class="composer replycomposer">${queued('Explain what the pilot will test.')}${queued('Most of the background belongs in the literature review.')}${input()}</div>${model}</div></div>`});

['1','---'],['2','<span class="red">title:</span> <span class="green">Research project overview</span>'],['3','<span class="red">description:</span> <span class="green">Our research question, pilot, and next steps.</span>'],['4','---'],['5',''],['6','<span class="bluecode"># Research question</span>']].map(([n,t])=>`<div class="line"><span class="ln">${n}</span><span class="code">${t}</span></div>`).join('')}<div class="linecomment"><div class="label">Line 6</div>Rename this heading “What we want to learn”.</div><div class="line"><span class="ln">7</span></div><div class="line focus"><span class="ln">8</span><span class="code">We want to understand why small firms enter new markets. The pilot will help us identify the barriers they face and how they decide whether to expand.</span></div><div class="linecomment editing"><div class="label">Line 8</div><div class="placeholder"><span>│Add a comment</span>${I('comment')}</div></div>${[['9',''],['10','## What we know so far'],['11',''],['12','Our first interviews point to three concerns:'],['13',''],['14','- Access to credit'],['15','- Permits and local rules'],['16','- The cost of finding customers'],['17',''],['18','## Next steps'],['19',''],['20','Review the <span class="green">[pilot notes]</span><span class="teal">(notes/pilot.md)</span> and revise the survey.'],['21',''],['22','## Open questions'],['23',''],['24','Which barriers should we examine first?']].map(([n,t])=>`<div class="line"><span class="ln">${n}</span><span class="code">${t}</span></div>`).join('')}</div></div></div>`});
