site_name: Claude Blattman · AI for Professionals Who Don't Code
site_url: https://claudeblattman.com
site_description: A project manager's guide to building AI workflows — from chatbots to self-improving systems
site_author: Chris Blattman
repo_url: https://github.com/chrisblattman/claudeblattman
repo_name: chrisblattman/claudeblattman

edit_uri: ""

extra_css:
  # The ?v= is a CONTENT HASH, regenerated by scripts/stamp-css.py.
  # MkDocs does not fingerprint extra_css the way it does Material's own
  # bundles, so without this the browser happily serves a cached
  # stylesheet after an edit. That cost six rounds of chasing CSS that
  # was already correct, and Shay hit it too.
  - stylesheets/extra.css?v=913b80880a

# mkdocs serve watches docs/ and mkdocs.yml, but NOT the theme custom_dir. So
# edits to overrides/*.html triggered no rebuild and `mkdocs serve` kept
# handing out a stale template — a preview that silently mixed current markdown
# with an older build's JavaScript. That cost a round of "I'm not seeing it."
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  # Single scheme, no toggle. Shay: "let's drop the light vs dark mode."
  # The CSS still carries both schemes' accent values, so re-adding a second
  # palette entry here is all it takes to bring the switcher back.
  palette:
    scheme: default
    primary: blue grey
    accent: teal
  # Off on purpose. Material's loader requests DM Sans at 300/400/700 only, so
  # any rule wanting 500 or 600 snapped to a neighbour. Both faces are loaded
  # from docs/stylesheets/extra.css instead, as variable 400..700.
  font: false
  favicon: images/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.prefetch
    # navigation.indexes deliberately OFF. With it on, a section's index.md
    # *becomes* the section, so starter-kit/index.md got no row of its own and
    # — the real problem — no integrated table of contents nested under it.
    # The dropdowns name their overview pages explicitly ("All tools",
    # "All workflows"), so the feature buys nothing here.
    # navigation.top dropped — it floated a "Back to top" pill over the page
    # on scroll. Readers use the keyboard or the scrollbar.
    # navigation.footer dropped — it rendered the previous/next step links at
    # the bottom of every page. Their order came from the nav tree, so they
    # regularly disagreed with a page's own "what's next" line.
    - navigation.sections
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
    # Nests the current page's headings into the left nav and removes the
    # separate 242px right-hand rail. Safe because navigation.tabs makes the
    # sidebar 'lifted' — it renders only the active tab (max 23 links, not 53).
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  # Six tabs. The homepage is an icon; Start Here, Tools, Workflows and About
  # carry dropdowns (overrides/partials/tabs-item.html). Workflows groups its
  # entries under four bolded section labels.
  - Home: index.md
  - Start Here:
    - Newcomers: starter-kit/index.md
    # These were pointed at essentials/project-folders.md and
    # workflows/plan-review-browser.md, which are substantial pages with 8 and 6
    # inbound links apiece — overwriting them would have destroyed that content
    # and left those links pointing at something else entirely. The checklists
    # are new sibling pages instead; both old pages stay reachable and are now
    # linked from the new ones.
    - Occasional Users: starter-kit/occasional.md
    - Regular Users: starter-kit/regular.md
    # Fourth, after the three guides, because it routes THROUGH them — weeks 1,
    # 2 and 6 are the three pages above. It is a reading order for the whole
    # site, not a fourth kind of reader.
    - The two-month plan: starter-kit/two-month-plan.md
  # Build Your Own replaces the old Tools tab. Tools held 6 entries of which
  # only 3 were actually tools — "What this costs" is a first-session question
  # and "Other tools" is a chatbot comparison. Kept FLAT on purpose: a tab with
  # sections lists only its category rows in the dropdown
  # (overrides/partials/tabs-item.html), so grouping these would hide all ten.
  - Build Your Own:
    # No index page here on purpose. The left sidebar lists every page in this
    # section (see SECTION SIDEBAR in extra.css), so a hub page would be a
    # second copy of the same list — and it rendered as a redundant
    # "Build Your Own" row at the top of the tab's own dropdown.
    - Picking your agent: essentials/chatgpt-vs-claude.md
    - External tools I use: build-your-own/external-tools.md
    - Connect your apps: toolkit/mcp-setup.md
    - Folder organization: essentials/project-folders.md
    - Write your AGENTS.md: toolkit/claude-md.md
    - Set up rules and guidelines: build-your-own/rules.md
    - Skills: system/building-skills.md
    - Create council agents: workflows/council.md
    - Teaching AI your voice: essentials/voice.md
    - Cross-vendor review: system/ai-integration.md
  - Workflows:
    # Ten entries moved out to Build Your Own, which took General best practices
    # from 11 to 4 — it had become, in the trainer's words, "a junk drawer with
    # a label". Workflows now means: do a task start to finish.
    #
    # Each category's FIRST entry is its landing page, and the tab dropdown now
    # shows only the three category rows pointing at those three pages
    # (overrides/partials/tabs-item.html). This was tried once before as
    # categories-only and reverted, because a category row then landed on
    # whichever workflow happened to be first and the rest were invisible. The
    # landing pages are what make it work this time — see §0an in HANDOFF.md.
    # No single Workflows hub page any more — Shay, 7 Oct: "instead of one
    # home tab, three, one for each category". The tab label falls through to
    # the first category's landing page (see tabs-item.html), and
    # workflows/index.md is out of the nav.
    - General best practices:
      - workflows/best-practices.md
      - "Prompt, plan, review, revise": workflows/first-session-skills.md
      - "Start-task, HANDOFF, done": essentials/session-management.md
      - "Search past sessions": workflows/recall.md
      - "Organizing your cloud storage": downloads/cloud-storage-guide.md
      # STUB — week 6 of the plan. Sits here rather than under research because
      # it is a standing practice for any coding session, not a research step.
      - "Coding rules": workflows/coding-rules.md
    - Project management and research:
      - workflows/projects-and-research.md
      - "Catch up on a project": workflows/project-management.md
      - "Weekly review": workflows/weekly-review.md
      - "Sub-project routing": workflows/sub-project-routing.md
      - "Deep research": workflows/deep-research.md
      - "Example: project dashboard": workflows/examples/project-overview-example.md
      # STUB — week 6 of the plan, alongside Deep research.
      - "The data analysis workflow": workflows/data-analysis.md
    - Executive Assistant:
      - workflows/executive-assistant.md
      - "Building an AI executive assistant": toolkit/executive-assistant.md
      - "Meeting follow-up": workflows/meeting-workflow.md
      - "Noise cancelling: school digest": workflows/school-digest.md
      - "Tax season": tax-workflow/index.md
      - "Shopping decisions": essentials/folders/shopping.md
      - "Vacation planning": essentials/folders/vacation.md
      - "Health and fitness": essentials/folders/health.md
      # STUB — a week 8 life widget, same shape as the three above.
      - "Academic expenses": essentials/folders/academic-expenses.md
  - About:
    - About Claude Blattman: about.md
    - About Chris Blattman: about-chris.md
    - Resources: resources.md
    # Templates live in About beside Resources: both are "here is stuff you can
    # take". The reader never needs GitHub — every row carries a prompt that
    # has the agent fetch the file. The repo stays the single source of truth,
    # so nothing is duplicated into docs/ and nothing can drift.
    - Templates: templates.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:
      # No visible pilcrow beside every heading. Shay: "they're not helpful and
      # I think they're visually clutter." Heading `id` attributes still come
      # from this extension, so every existing #deep-link keeps working.
      permalink: false
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - meta
  - redirects:
      redirect_maps:
        quickstart.md: essentials/index.md
        setup/modes.md: setup/index.md
        toolkit/skills-guide.md: setup/skill-reference.md
        workflows/tips-pipeline.md: system/continuous-improvement.md
        # /workflows/ is a live URL on main, so the hub cannot just vanish.
        # Three category pages replaced it; general best practices is the one
        # a reader arriving cold should land on.
        workflows/index.md: workflows/best-practices.md
  - social:
      cards_layout_options:
        background_color: "#263238"
        color: "#80cbc4"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chrisblattman/claudeblattman
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/cblatts

