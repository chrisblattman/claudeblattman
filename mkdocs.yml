    - About Claude Blattman: about.md
    - About Chris Blattman: about-chris.md
    - How I put AI to work: how-i-use-ai.md
    - Resources: resources.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:
      # No visible pilcrow beside every heading. Shay: "they're not helpful and
      # I think they're visually clutter." Heading `id` attributes still come
      # from this extension, so every existing #deep-link keeps working.
      permalink: false
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

