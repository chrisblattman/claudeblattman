  - Workflows:
    - Projects and research:
      - workflows/projects-and-research.md
      - Deep research: workflows/deep-research.md
      - Catch up on a project: workflows/project-management.md
      - Save and resume work: workflows/session-management.md
      - Find past work: workflows/recall.md
      - Weekly review: workflows/weekly-review.md
