    - Dictate:
      - Start dictating: hyperlinks/wispr-flow.md
    - Transcribe and follow up:
      - Transcribe your meetings: hyperlinks/granola.md
    - Teach it your voice:
      - Build your voice pack: build-your-own/voice.md
      - Build a system: how-i-improve-the-work.md
    - Organize your digital life:
      - Organize cloud storage: workflows/cloud-storage-guide.md
