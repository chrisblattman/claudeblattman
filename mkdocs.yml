repo_name: chrisblattman/claudeblattman

edit_uri: ""

# Link validation. MkDocs checks that an internal link's TARGET FILE exists, but
# says nothing about #anchors — a link to a heading that was renamed or deleted
# builds clean and 404s silently in the reader's browser, even under --strict.
# `anchors: warn` closes that. Added 14 Oct 2026.
#
# Deliberately `warn`, not `error`: there is a known backlog of broken links to
# clear first (BACKLOG N17's empty hrefs, C0's 23 inbound links to a page being
# removed). Raise anchors + unrecognized_links to `error` once that is clean,
# so a regression fails the build instead of shipping.
#
# mkdocs-staging.yml INHERITs this file, so the preview build gets it for free.
validation:
  # `omitted_files` stays at MkDocs' default `info`, NOT `warn`. Raising it to
  # warn broke `--strict` on 14 Oct: ~20 pages are out of nav ON PURPOSE —
  # 404.md, changelog.md, privacy.md, and the whole `hyperlinks/` tree, which
  # exists to be the destination of redirects rather than a nav entry. Warning
  # on those is pure noise, and under --strict it aborts the build.
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  # The ?v= is a CONTENT HASH, regenerated by scripts/stamp-css.py.
  # MkDocs does not fingerprint extra_css the way it does Material's own
  # bundles, so without this the browser happily serves a cached
  # stylesheet after an edit. That cost six rounds of chasing CSS that
  # was already correct, and Shay hit it too.
  - stylesheets/extra.css?v=13246aab66

# mkdocs serve watches docs/ and mkdocs.yml, but NOT the theme custom_dir. So
# edits to overrides/*.html triggered no rebuild and `mkdocs serve` kept
# handing out a stale template — a preview that silently mixed current markdown
# with an older build's JavaScript. That cost a round of "I'm not seeing it."
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  # Two palettes with a toggle, restored 12 Oct. It was dropped in 960a5a2 on
  # Shay's "let's drop the light vs dark mode", then Chris asked for it back on
  # the 9 Oct review call — "I kind of like the color and the dark-light
  # option". Do not remove it again without asking him.
  #
  # extra.css carries slate values for the accent and a handful of components,
  # NOT for all of them. Anything added to that stylesheet needs a slate check
  # before it ships — see the contrast note at the top of extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Off on purpose. Material's loader requests DM Sans at 300/400/700 only, so
  # any rule wanting 500 or 600 snapped to a neighbour. Both faces are loaded
  # from docs/stylesheets/extra.css instead, as variable 400..700.
  font: false
  favicon: images/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.prefetch
    # navigation.indexes deliberately OFF. With it on, a section's index.md
    # *becomes* the section, so a section index page got no row of its own and
    # — the real problem — no integrated table of contents nested under it.
    # The dropdowns name their overview pages explicitly ("All tools",
    # "All workflows"), so the feature buys nothing here.
    # navigation.top dropped — it floated a "Back to top" pill over the page
    # on scroll. Readers use the keyboard or the scrollbar.
    # navigation.footer dropped — it rendered the previous/next step links at
    # the bottom of every page. Their order came from the nav tree, so they
    # regularly disagreed with a page's own "what's next" line.
    - navigation.sections
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
    # Nests the current page's headings into the left nav and removes the
    # separate 242px right-hand rail. Safe because navigation.tabs makes the
    # sidebar 'lifted' — it renders only the active tab (max 23 links, not 53).
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

# Kept in the repo for reference, deliberately NOT built into the site.
# Reviving a page is a git mv back out plus a nav line.
exclude_docs: |
  archive/

